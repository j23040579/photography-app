name: photograph
description: A private, offline photo journal with thoughtful prompts for every occasion.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.1
  camera_windows: 0.3.0+1
  file_picker: 13.2.0
  flutter_local_notifications: 22.3.2
  flutter_timezone: 5.1.1
  image_picker: 1.2.4
  path_provider: 2.1.6
  timezone: 0.11.2
  video_player: 2.14.1
  video_player_win: 3.3.1
  share_plus: ^13.3.1
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.5
  http: ^1.6.0
  url_launcher: ^6.3.3
  connectivity_plus: ^7.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
